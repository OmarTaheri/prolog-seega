<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache">
  <title>Seega in Prolog</title>
  <script>
    // Add a fresh ?v= to every file so the browser never shows an old cached deck.
    window.DECK_V = Date.now();
    document.write('<link rel="stylesheet" href="/presentation/style.css?v=' + window.DECK_V + '">');
  </script>
</head>
<body>
  <div id="viewport">
    <div id="stage">
      <div id="section"></div>
      <div id="slide"></div>
      <div id="counter"></div>
    </div>
  </div>
  <div id="progress"><div id="bar"></div></div>
  <div id="help">← → or click to move · F fullscreen · Home / End</div>
  <script>
    document.write('<script src="/presentation/slides.js?v=' + window.DECK_V + '"><\/script>');
    document.write('<script src="/presentation/app.js?v=' + window.DECK_V + '"><\/script>');
  </script>
</body>
</html>
